defaults:
  - base_dataset

# One posed-RGBD stream per robot, each on its own ROS_DOMAIN_ID, round-robined
# into one mapper. Topic names are TEMPLATES: {robot} -> robot_<id>,
# {id} -> the bare id.
_target_: rayfronts.datasets.MultiRobotRos2Subscriber

# Robots to consume. Overridden on the command line, e.g. robot_ids=[1,2].
robot_ids: [1]

# ROS_DOMAIN_ID per robot. null = "same as the robot id", which is what
# isaac-sim's multi-drone spawner does (spawn_px4_multirotor_node domain_id=i)
# and what robot/docker/.bashrc resolves for the robot containers.
domain_ids: null

rgb_topic: "/{robot}/sensors/front_stereo/left/image_rect"
depth_topic: "/{robot}/sensors/front_stereo/left/depth_ground_truth"
intrinsics_topic: "/{robot}/sensors/front_stereo/left/camera_info"

# The raw odometry topic. The single-robot config had to go through the
# perception_bringup odom_to_pose_stamped bridge because Ros2Subscriber only
# understood PoseStamped; this dataset reads nav_msgs/Odometry directly, so no
# bridge node is needed. Set pose_msg_type=pose_stamped to use the bridge.
pose_topic: "/{robot}/odometry_conversion/odometry"
pose_msg_type: odometry   # odometry | pose_stamped

# mavros' fused global fix. Used only to measure boot_enu.
navsat_topic: "/{robot}/interface/mavros/global_position/global"

# How each robot's map-frame origin is located in the shared world ENU frame.
#   gps    - measure it: mean(gps_to_enu(fix) - odom) over anchor_samples
#            fixes, the same recipe map_anchor_node and raven_nav use.
#   static - take it from robot_offsets_xy (e.g. straight out of SPAWN_CONFIGS).
#   none   - no shift; only correct for one robot at the world origin.
anchor_mode: gps
anchor_samples: 10

# {id: [x, y]} in world ENU metres. Only read when anchor_mode=static.
robot_offsets_xy: null

# [lat, lon, alt] of the shared world origin. null uses the stack-wide
# "Lisbon" constant from coordination_bringup/frame_utils.py, which
# gcs_utils.py and simulation/.../gps_utils.py also use.
gps_origin: null

# A string of 3 letters describing the incoming pose convention in
# r/l u/d f/b. AirStack odometry is FLU.
src_coord_system: "flu"

# Per-robot frame queue depth (oldest dropped when full) and the
# ApproximateTimeSynchronizer slop. 0.01 matches the proven single-robot
# deployment: a looser slop pairs an image with a staler pose.
queue_size: 10
sync_slop_s: 0.01

# QoS for rgb/depth/pose. "reliable" reproduces the legacy subscriber, which
# passes a bare depth int to message_filters.
sensor_reliability: reliable

# Give up waiting for the first CameraInfo after this many seconds.
# null waits forever (the legacy behaviour).
intrinsics_timeout_s: null
